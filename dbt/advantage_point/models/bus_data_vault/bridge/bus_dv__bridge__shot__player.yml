version: 2

models:
  - name: bus_dv__bridge__shot__player
    description: >
      Bridge table for shot_player data.

    columns:
      - name: lk_shot_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
          
      - name: hk_shot
        data_type: string
        description: Hash-based unique identifier for shot.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__shot')
              field: hk_shot

      - name: bk_shot
        data_type: string
        description: Unique identifier for shot.
        data_tests:
          - not_null

      - name: hk_player
        data_type: string
        description: Hash-based unique identifier for player.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__player')
              field: hk_player

      - name: bk_player
        data_type: string
        description: Unique identifier for player.
        data_tests:
          - not_null

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).
        data_tests:
          - not_null