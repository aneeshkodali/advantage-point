version: 2

models:
  - name: bus_dv__bridge__point__set
    description: >
      Bridge table for point_set data.

    columns:
      - name: lk_point_set
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
          
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: hk_set
        data_type: string
        description: Hash-based unique identifier for set.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__set')
              field: hk_set

      - name: bk_set
        data_type: string
        description: Unique identifier for set.
        data_tests:
          - not_null

      - name: point_number_in_set
        data_type: integer
        description: Point number in the current set.
        data_tests:
          - not_null