version: 2

models:
  - name: bus_dv__bridge__match__tournament
    description: >
      Bridge table for match_tournament data.

    columns:
      - name: lk_match_tournament
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__link__match__tournament')
              field: lk_match_tournament

      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__pit__match')
              field: hk_match

      - name: hk_tournament
        data_type: string
        description: Hash-based unique identifier for tournament.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__pit__tournament')
              field: hk_tournament

      - name: link_load_datetime
        description: Load timestamp from the link model.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null