version: 2

models:
  - name: bus_dv__bridge__point__player
    description: >
      Bridge table for point_player data.

    columns:
      - name: lk_point_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
          
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: hk_player
        data_type: string
        description: Hash-based unique identifier for player.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__player')
              field: hk_player

      - name: bk_player
        data_type: string
        description: Unique identifier for player.
        data_tests:
          - not_null

      - name: point_score_in_game_player
        data_type: string
        description: Player point score in the current game.
        data_tests:
          - not_null

      - name: point_score_in_game_player_int
        data_type: integer
        description: Player point score (as an integer) in the current game.
        data_tests:
          - not_null

      - name: is_point_server
        data_type: boolean
        description: Boolean flag indicating if the player served that point.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: is_point_ending_player
        data_type: boolean
        description: Boolean flag indicating if the player ended the point (hit last shot in rally).
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: is_point_winner
        data_type: boolean
        description: Boolean flag indicating if the player won that point.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]