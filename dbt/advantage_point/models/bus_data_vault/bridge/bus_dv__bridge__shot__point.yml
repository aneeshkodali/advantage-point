version: 2

models:
  - name: bus_dv__bridge__shot__point
    description: >
      Bridge table for shot_point data.

    columns:
      - name: lk_shot_point
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
          
      - name: hk_shot
        data_type: string
        description: Hash-based unique identifier for shot.
        data_tests:
          - not_null

      - name: bk_shot
        data_type: string
        description: Unique identifier for shot.
        data_tests:
          - not_null

      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: shot_number_in_point
        data_type: integer
        description: Shot number in point (treats each serve as separate 'shot').
        data_tests:
          - not_null

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).
        data_tests:
          - not_null