version: 2

models:
  - name: bus_dv__bridge__point__game
    description: >
      Bridge table for point_game data.

    columns:
      - name: lk_point_game
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
          
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: hk_game
        data_type: string
        description: Hash-based unique identifier for game.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__game')
              field: hk_game

      - name: bk_game
        data_type: string
        description: Unique identifier for game.
        data_tests:
          - not_null

      - name: point_number_in_game
        data_type: integer
        description: Point number in the current game.
        data_tests:
          - not_null