version: 2

models:
  - name: bus_dv__bridge__match__point
    description: >
      Bridge table for match_point data.

    columns:
      - name: lk_match_point
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__link__match__point')
              field: lk_match_point

      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: link_load_datetime
        data_type: timestamp
        description: Load timestamp from the link model.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null