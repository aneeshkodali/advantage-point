version: 2

models:
  - name: bus_dv__pit__shot
    description: >
      Point-in-time (PIT) table for shhot data. Retrieves the most recent
      satellite records per shot.

    columns:
      - name: hk_shot
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('bus_dv__hub__shot')
              field: hk_shot

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).

      - name: shot_direction
        data_type: string
        description: Direction of the shot.

      - name: shot_result
        data_type: string
        description: Outcome of the shot.
        
      - name: shot_type
        data_type: string
        description: Type of shot.

      - name: shot_details_hash_diff
        data_type: string
        description: Hash of attributes to track change in shot_details satellite model.
        
      - name: shot_details_load_datetime
        data_type: timestamp
        description: Load timestamp from the shot_details satellite model.
        
      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this PIT record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null