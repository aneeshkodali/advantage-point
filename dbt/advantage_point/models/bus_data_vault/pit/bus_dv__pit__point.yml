version: 2

models:
  - name: bus_dv__pit__point
    description: >
      Point-in-time (PIT) table for point data. Retrieves the most recent
      satellite records per point.

    columns:
      - name: hk_point
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: set_score_in_match
        data_type: string
        description: Set score within the match (from server's perspective).

      - name: game_score_in_set
        data_type: string
        description: Game score within the set (from server's perspective).

      - name: point_score_in_game
        data_type: string
        description: Point score within the game (from server's perspective).

      - name: point_description
        data_type: string
        description: Semicolon-separated list-like string of shots in the point rally.
      
      - name: point_details_hash_diff
        description: Hash of attributes to track change in point_details satellite model.
        data_tests:
          - not_null

      - name: point_details_load_datetime
        description: Load timestamp from the point_details satellite model.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        description: Timestamp when this PIT record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null