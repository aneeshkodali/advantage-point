version: 2

models:
  - name: bus_dv__pit__match
    description: >
      Point-in-time (PIT) table for match data. Retrieves the most recent
      satellite records per match.

    columns:
      - name: hk_match
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: hk_tournament
        description: Hash-based unique identifier for tournament.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__tournament')
              field: hk_tournament

      - name: match_title
        description: Name of the match. Includes tournament, players, and round.

      - name: match_result
        description: Outcome of the match. Includes winner, loser, and score.

      - name: match_details_hash_diff
        description: Hash of attributes to track change in match_details satellite model.
        data_tests:
          - not_null

      - name: match_details_load_datetime
        description: Load timestamp from the match_details satellite model.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        description: Timestamp when this PIT record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null