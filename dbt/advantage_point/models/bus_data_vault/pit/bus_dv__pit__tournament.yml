version: 2

models:
  - name: bus_dv__pit__tournament
    description: >
      Point-in-time (PIT) table for tournament data. Retrieves the most recent
      satellite records per tournament.

    columns:
      - name: hk_tournament
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__tournament')
              field: hk_tournament

      - name: tournament_start_date
        data_type: date
        description: Tournament start date.

      - name: tournament_surface
        data_type: string
        description: Surface on which tournament is played.

      - name: tournament_draw_size
        data_type: integer
        description: Size of the tournament draw.

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: sat_load_datetime
        description: Load timestamp from the source satellite table.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        description: Timestamp when this PIT record was generated in the Business Vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null