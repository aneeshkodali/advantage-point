version: 2

models:
  - name: bus_dv__pit__player
    description: >
      Point-in-time (PIT) table for player data. Retrieves the most recent
      satellite records per player.

    columns:
      - name: hk_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__player')
              field: hk_player

      - name: player_name
        data_type: string
        description: Player name.

      - name: player_full_name
        data_type: string
        description: Player full name.

      - name: player_last_name
        data_type: string
        description: Player's last name.

      - name: player_date_of_birth
        data_type: date
        description: Player date of birth.

      - name: player_country
        data_type: string
        description: Player's country (abbreviated).

      - name: player_hand
        data_type: string
        description: Denotes if player is right or left handed.

      - name: player_backhand
        data_type: string
        description: Denotes if player uses one-handed or two-handed backhand.

      - name: player_height_in_cm
        data_type: integer
        description: Player height (in centimeters).

      - name: player_bio_hash_diff
        data_type: string
        description: Hash of attributes to track change in player_bio satellite model.
        
      - name: player_bio_load_datetime
        data_type: timestamp
        description: Load timestamp from the player_bio satellite model.
        
      - name: is_player_active
        data_type: boolean
        description: Denotes if player is active.

      - name: player_current_singles_rank
        data_type: integer
        description: Current singles ranking.

      - name: player_peak_singles_ranking
        data_type: integer
        description: Player's highest singles ranking.

      - name: player_first_peak_singles_ranking_date
        data_type: date
        description: Date when player first achieved highest singles ranking.

      - name: player_last_peak_singles_ranking_date
        data_type: date
        description: Date when player last achieved highest singles ranking.

      - name: player_current_doubles_ranking
        data_type: integer
        description: Current doubles ranking.

      - name: player_peak_doubles_ranking
        data_type: integer
        description: Player's peak doubles ranking.

      - name: player_first_peak_doubles_ranking_date
        data_type: date
        description: Date when player first achieved highest doubles ranking.

      - name: player_last_match_played_date
        date_type: date
        description: Date on which player's last match took place.

      - name: player_career_status_hash_diff
        data_type: string
        description: Hash of attributes to track change in player_career_status satellite model.
        
      - name: player_career_status_load_datetime
        data_type: timestamp
        description: Load timestamp from the player_career_status satellite model.
        
      - name: player_tour_id
        data_type: string
        description: Player ID for tour/organization.

      - name: player_team_cup_id
        data_type: string
        description: Player ID for team cup play.

      - name: player_itf_id
        data_type: string
        description: Player's ITF (International Tennis Foundation) ID.

      - name: player_competition_ids_hash_diff
        data_type: string
        description: Hash of attributes to track change in player_competition_ids satellite model.
        
      - name: player_competition_ids_load_datetime
        data_type: timestamp
        description: Load timestamp from the player_competition_ids satellite model.
        
      - name: player_twitter_handle
        data_type: string
        description: Player Twitter handle.

      - name: player_wikipedia_id
        data_type: string
        description: Player's Wikipedia ID.

      - name: player_media_presence_hash_diff
        data_type: string
        description: Hash of attributes to track change in player_media_presence satellite model.
        
      - name: player_media_presence_load_datetime
        data_type: timestamp
        description: Load timestamp from the player_media_presence satellite model.
        
      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this PIT record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null