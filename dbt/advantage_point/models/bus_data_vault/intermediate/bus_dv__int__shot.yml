version: 2

models:
  - name: bus_dv__int__shot
    description: >
      Intermediate model for shot data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_point
            - shot_number_in_point

    columns:
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).
        data_tests:
          - not_null
      
      - name: shot_text
        data_type: string
        description: Shot description. Includes stroke, direction, and result information.
        data_tests:
          - not_null

      - name: shot_number_in_point
        data_type: integer
        description: Shot number in point (treats each serve as separate 'shot').
        data_tests:
          - not_null

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: bk_shot
        data_type: string
        description: Unique identifier for shot.
        data_tests:
          - unique
          - not_null

      - name: shot_direction
        data_type: string
        description: Direction of the shot.

      - name: shot_result
        data_type: string
        description: Outcome of the shot.
        data_tests:
          - accepted_values:
              values: ['ace', 'double fault', 'forced error', 'service winner', 'unforced error', 'winner', null]
              quote: true
        
      - name: shot_type
        data_type: string
        description: Type of shot.

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null