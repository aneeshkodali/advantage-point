version: 2

models:
  - name: bus_dv__int__set
    description: >
      Intermediate model for set data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - bk_match
            - set_number_in_match

    columns:
      - name: set_number_in_match
        data_type: integer
        description: Set number in the match.
        data_tests:
          - not_null
      
      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: bk_match
        data_type: string
        description: Unique identifier for match.
        data_tests:
          - not_null

      - name: bk_set
        data_type: string
        description: Unique identifier for set.
        data_tests:
          - not_null

      - name: is_deciding_set
        data_type: boolean
        description: Boolean field to indicate if set is last set in the match.
        data_tests:
          - not_null
          - accepted_values:
              values: [false, true]

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null