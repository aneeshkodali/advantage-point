version: 2

models:
  - name: bus_dv__int__shot__player
    description: >
      Intermediate model for shot-player data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_shot
            - hk_player

    columns:

      - name: hk_shot
        data_type: string
        description: Hash-based unique identifier for shot.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__shot')
              field: hk_shot

      - name: bk_shot
        data_type: string
        description: Unique identifier for shot.
        data_tests:
          - not_null

      - name: hk_player
        data_type: string
        description: Hash-based unique identifier for player.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__player')
              field: hk_player

      - name: bk_player
        data_type: string
        description: Unique identifier for player.
        data_tests:
          - not_null

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null