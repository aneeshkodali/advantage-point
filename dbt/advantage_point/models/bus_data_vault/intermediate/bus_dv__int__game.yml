version: 2

models:
  - name: bus_dv__int__game
    description: >
      Intermediate model for game data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - bk_match
            - game_number_in_match

    columns:
      - name: game_number_in_set
        data_type: integer
        description: Game number in the current set.
        data_tests:
          - not_null
      
      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: bk_match
        data_type: string
        description: Unique identifier for match.
        data_tests:
          - not_null

      - name: game_number_in_match
        data_type: integer
        description: Game number in the match.
        data_tests:
          - not_null

      - name: bk_game
        data_type: string
        description: Unique identifier for game.
        data_tests:
          - unique
          - not_null

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null