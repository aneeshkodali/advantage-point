version: 2

models:
  - name: bus_dv__int__point__game
    description: >
      Intermediate model for point-game data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_point
            - hk_game

    columns:
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier for point.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: hk_game
        data_type: string
        description: Hash-based unique identifier for game.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__game')
              field: hk_game

      - name: bk_point
        data_type: string
        description: Unique identifier for point.
        data_tests:
          - not_null

      - name: bk_game
        data_type: string
        description: Unique identifier for game.
        data_tests:
          - not_null

      - name: point_number_in_game
        data_type: integer
        description: Point number in the current game.
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null