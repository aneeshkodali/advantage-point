version: 2

models:
  - name: bus_dv__sat__point
    description: >
      Extended satellite table for point data.

    columns:
      - name: hk_point
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: set_score_in_match
        data_type: string
        description: Set score within the match (from server's perspective).
        data_tests:
          - not_null

      - name: game_score_in_set
        data_type: string
        description: Game score within the set (from server's perspective).
        data_tests:
          - not_null

      - name: point_score_in_game
        data_type: string
        description: Point score within the game (from server's perspective).
        data_tests:
          - not_null

      - name: point_description
        data_type: string
        description: Semicolon-separated list-like string of shots in the point rally.
        data_tests:
          - not_null

      - name: point_details_hash_diff
        data_type: string
        description: Hash of attributes to track change in point_details satellite model.
        data_tests:
          - not_null

      - name: point_details_load_datetime
        data_type: timestamp
        description: Load timestamp from the point_details satellite model.
        data_tests:
          - not_null
      
      - name: set_score_in_match_server
        data_type: integer
        description: Server set score in the match.
        data_tests:
          - not_null

      - name: set_score_in_match_receiver
        data_type: integer
        description: Receiver set score in the match.
        data_tests:
          - not_null

      - name: game_score_in_set_server
        data_type: integer
        description: Server game score in the current set.
        data_tests:
          - not_null

      - name: game_score_in_set_receiver
        data_type: integer
        description: Receiver game score in the current set.
        data_tests:
          - not_null

      - name: point_score_in_game_server
        data_type: string
        description: Server point score in the current game.
        data_tests:
          - not_null

      - name: point_score_in_game_server_int
        data_type: integer
        description: Server point score (as an integer) in the current game.
        data_tests:
          - not_null

      - name: point_score_in_game_receiver
        data_type: string
        description: Receiver point score in the current game.
        data_tests:
          - not_null

      - name: point_score_in_game_receiver_int
        data_type: integer
        description: Receiver point score (as an integer) in the current game.
        data_tests:
          - not_null

      - name: point_length
        data_type: integer
        description: >
          Number of shots in point.
          Does NOT factor in second serves (1st and 2nd serve count as 1 serve attempt/shot) or point result.
        data_tests:
          - not_null

      - name: point_result
        data_type: string
        description: Outcome of the point rally.
        data_tests:
          - accepted_values:
              values: ['ace', 'double fault', 'forced error', 'service winner', 'unforced error', 'winner', null]
              quote: true
        
      - name: set_number_in_match
        data_type: integer
        description: Set number in the match.
        data_tests:
          - not_null

      - name: game_number_in_set
        data_type: integer
        description: Game number in the current set.
        data_tests:
          - not_null
      
      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: match_date
        data_type: date
        description: Date when match took place.
        data_tests:
          - not_null
        
      - name: match_gender
        data_type: string
        description: Gender of the match.
        data_tests:
          - not_null

      - name: match_tournament
        data_type: string
        description: Tournament where match took place.
        data_tests:
          - not_null

      - name: match_round
        data_type: string
        description: Round within tournament when match took place.
        data_tests:
          - not_null

      - name: match_players
        data_type: string
        description: List-like string of players in the match.
        data_tests:
          - not_null

      - name: point_number_in_match
        data_type: integer
        description: Point number in the match.
        data_tests:
          - not_null
        
      - name: game_number_in_match
        data_type: integer
        description: Game number in the match.
        data_tests:
          - not_null

      - name: point_number_in_set
        data_type: integer
        description: Point number in the current set.
        data_tests:
          - not_null

      - name: point_number_in_game
        data_type: integer
        description: Point number in the current game.
        data_tests:
          - not_null
      
      - name: rally_length
        data_type: integer
        description: >
          Number of shots in the rally, accounting for point outcome (does not count shot that resulted in an 'error').
          Does NOT factor in second serves (1st and 2nd serve count as 1 serve attempt/shot).

      - name: point_side
        data_type: string
        description: Side of the court on which the point is played.
        data_tests:
          - not_null
          - accepted_values:
              values: ['ad', 'deuce']
              quote: true

      - name: is_break_point
        data_type: boolean
        description: Boolean flag to indicate if point is a break point (receiver has a chance to win the game).
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: is_game_point
        data_type: boolean
        description: Boolean flag to indicate if point is a game point (server has a chance to win the game).
        data_tests:
          - not_null

      - name: bus_dv_load_datetime
        data_type: timestamp
        description: Timestamp when this bridge record was generated in the business vault.
        data_tests:
          - not_null

      - name: bus_dv_source_model
        data_type: string
        description: Name of the dbt model that generated this record for traceability.
        data_tests:
          - not_null