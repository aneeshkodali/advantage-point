version: 2

models:
  - name: bus_dv__sat__shot_details
    description: >
      Satellite model for shot details data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_shot
            - load_datetime

    columns:
      - name: hk_shot
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('bus_dv__hub__shot')
              field: hk_shot

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.

      - name: shot_number
        data_type: integer
        description: Shot number in point (assigns same value to multiple serve attempts).

      - name: shot_direction
        data_type: string
        description: Direction of the shot.

      - name: shot_result
        data_type: string
        description: Outcome of the shot.
        
      - name: shot_type
        data_type: string
        description: Type of shot.