version: 2

models:
  - name: bus_dv__sat__point_details
    description: >
      Satellite model for point details data.

    columns:
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: point_side
        data_type: string
        description: Side of the court on which the point is played.
        
      - name: is_break_point
        data_type: boolean
        description: Boolean flag to indicate if point is a break point (receiver has a chance to win the game).
        
      - name: is_game_point
        data_type: boolean
        description: Boolean flag to indicate if point is a game point (server has a chance to win the game).