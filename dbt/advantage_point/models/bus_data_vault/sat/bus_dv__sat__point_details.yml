version: 2

models:
  - name: bus_dv__sat__point_details
    description: >
      Satellite model for point details data.

    columns:
      - name: hk_point
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('raw_dv__hub__point')
              field: hk_point

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: point_side
        data_type: string
        description: Side of the court on which the point is played.

      - name: point_length
        data_type: integer
        description: >
          Number of shots in point.
          Does NOT factor in second serves (1st and 2nd serve count as 1 serve attempt/shot) or point result.

      - name: point_result
        data_type: string
        description: Outcome of the point rally.
        
      - name: rally_length
        data_type: integer
        description: >
          Number of shots in the rally, accounting for point outcome (does not count shot that resulted in an 'error').
          Does NOT factor in second serves (1st and 2nd serve count as 1 serve attempt/shot).
