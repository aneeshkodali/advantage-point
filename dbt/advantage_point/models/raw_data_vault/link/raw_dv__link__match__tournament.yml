version: 2

models:
  - name: raw_dv__link__match__tournament
    description: Link table for match tournament data.
    data_tests:
      - all_record_sources_referenced_in_link
    columns:
      - name: lk_match_tournament
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: bk_match
        data_type: string
        description: Unique identifier for match.
        data_tests:
          - not_null

      - name: hk_tournament
        data_type: string
        description: Hash-based unique identifier for tournament.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__tournament')
              field: hk_tournament

      - name: bk_tournament
        data_type: string
        description: Unique identifier for tournament.
        data_tests:
          - not_null