version: 2

models:
  - name: raw_dv__hub__tournaments
    description: Hub table for tournament data.
    data_tests:
      - all_record_sources_referenced_in_hub
    columns:
      - name: hk_tournament
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null
      
      - name: bk_tournament
        data_type: string
        description: Unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: tournament_year
        data_type: integer
        description: Makes up business key.
        data_tests:
          - not_null

      - name: tournament_gender
        data_type: string
        description: Makes up business key.
        data_tests:
          - not_null
          - accepted_values:
              values: ['M', 'W']
              quote: true
      
      - name: tournament_name
        data_type: string
        description: Makes up business key.
        data_tests:
          - not_null   
