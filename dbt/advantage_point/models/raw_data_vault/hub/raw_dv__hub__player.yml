version: 2

models:
  - name: raw_dv__hub__player
    description: Hub table for player data.
    data_tests:
      - all_record_sources_referenced_in_hub
    columns:
      - name: hk_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - unique
          - not_null

      - name: bk_player
        data_type: string
        description: Unique identifier.
        data_tests:
          - unique
          - not_null

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null
      
      - name: player_name
        data_type: string
        description: Makes up business key.
        data_tests:
          - not_null

      - name: player_gender
        data_type: string
        description: Makes up business key.
        data_tests:
          - not_null