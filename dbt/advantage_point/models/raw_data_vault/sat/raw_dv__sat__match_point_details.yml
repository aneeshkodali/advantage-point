version: 2

models:
  - name: raw_dv__sat__match_point_details
    description: Satellite table for match point details.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_match_point
            - load_datetime
    columns:
      - name: hk_match_point
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match_point')
              field: hk_match_point

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: hk_match
        data_type: string
        description: Hash-based unique identifier for match.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__match')
              field: hk_match

      - name: point_server
        data_text: string
        description: Player who is serving the point.
        data_tests:
          - not_null

      - name: set_score_in_match
        data_type: string
        description: Set score within the match (from server's perspective).
        data_tests:
          - not_null

      - name: game_score_in_set
        data_type: string
        description: Game score within the set (from server's perspective).
        data_tests:
          - not_null

      - name: point_score_in_game
        data_type: string
        description: Point score within the game (from server's perspective).
        data_tests:
          - not_null
      
      - name: point_description
        data_type: string
        description: Semicolon-separated list-like string of shots in the point rally.
        data_tests:
          - not_null