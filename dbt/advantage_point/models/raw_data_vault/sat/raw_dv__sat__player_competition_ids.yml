version: 2

models:
  - name: raw_dv__sat__player_competition_ids
    description: Satellite table for player competition IDs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_player
            - load_datetime
    columns:
      - name: hk_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__player')
              field: hk_player

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: player_tour_id
        data_type: string
        description: Player ID for tour/organization.

      - name: player_team_cup_id
        data_type: string
        description: Player ID for team cup play.

      - name: player_itf_id
        data_type: string
        description: Player's ITF (International Tennis Foundation) ID