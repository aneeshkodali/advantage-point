version: 2

models:
  - name: raw_dv__sat__player_career_status
    description: Satellite table for player career status. Includes status, rankings, and achievement dates.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_player
            - load_datetime
    columns:
      - name: hk_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__players')
              field: hk_player

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: is_player_active
        data_type: boolean
        description: Denotes if player is active.

      - name: player_current_singles_rank
        data_type: integer
        description: Current singles ranking.

      - name: player_peak_singles_ranking
        data_type: integer
        description: Player's highest singles ranking.

      - name: player_first_peak_singles_ranking_date
        data_type: date
        description: Date when player first achieved highest singles ranking.

      - name: player_last_peak_singles_ranking_date
        data_type: date
        description: Date when player last achieved highest singles ranking.

      - name: player_current_doubles_ranking
        data_type: integer
        description: Current doubles ranking.

      - name: player_peak_doubles_ranking
        data_type: integer
        description: Player's peak doubles ranking.

      - name: player_first_peak_doubles_ranking_date
        data_type: date
        description: Date when player first achieved highest doubles ranking.