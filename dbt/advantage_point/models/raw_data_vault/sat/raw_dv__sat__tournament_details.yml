version: 2

models:
  - name: raw_dv__sat__tournament_details
    description: Satellite table for tournament details.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_tournament
            - load_datetime
    columns:
      - name: hk_tournament
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__tournaments')
              field: hk_tournament
      
      - name: tournament_start_date
        data_type: date
        description: Tournament start date.

      - name: tournament_surface
        data_type: string
        description: Surface on which tournament is played.

      - name: tournament_draw_size
        data_type: integer
        description: Size of the tournament draw.

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null