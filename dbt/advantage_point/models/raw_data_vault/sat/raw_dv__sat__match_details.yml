version: 2

models:
  - name: raw_dv__sat__match_details
    description: Satellite table for match details.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_match
            - load_datetime
    columns:
      - name: hk_match
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__matches')
              field: hk_match

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null
]
      - name: match_title
        data_type: string
        description: Name of the match. Includes tournament, players, and round.

      - name: match_result
        data_type: string
        description: Outcome of the match. Includes winner, loser, and score.