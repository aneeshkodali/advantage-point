version: 2

models:
  - name: raw_dv__sat__player_bio
    description: Satellite table for player biography.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hk_player
            - load_datetime
    columns:
      - name: hk_player
        data_type: string
        description: Hash-based unique identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_dv__hub__players')
              field: hk_player

      - name: load_datetime
        data_type: timestamp
        description: Datetime when business key(s) is first recorded.
        data_tests:
          - not_null

      - name: record_source
        data_type: string
        description: Source from which business key(s) originated.
        data_tests:
          - not_null

      - name: hash_diff
        data_type: string
        description: Hash of attributes to track change.
        data_tests:
          - not_null

      - name: player_full_name
        data_type: string
        description: Player full name.

      - name: player_last_name
        data_type: string
        description: Player's last name.

      - name: player_date_of_birth
        data_type: date
        description: Player date of birth.

      - name: player_country
        data_type: string
        description: Player's country (abbreviated).

      - name: player_hand
        data_type: string
        description: Denotes if player is right or left handed.

      - name: player_backhand
        data_type: string
        description: Denotes if player uses one-handed or two-handed backhand.

      - name: player_height_in_cm
        data_type: integer
        description: Player height (in centimeters).