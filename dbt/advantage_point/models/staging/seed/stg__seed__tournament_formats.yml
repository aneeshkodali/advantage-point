version: 2

models:
  - name: stg__seed__tournament_formats
    description: >
      Standardized and typed tournament format definitions including match length,
      set/game rules, tiebreak types, and scoring formats.
    columns:
      - name: format_id
        data_type: string
        description: Unique identifier for the tournament format
        data_tests:
          - not_null
          - unique

      - name: match_format
        data_type: string
        description: Format of the match (e.g., Bo3, Bo5, Bo5_Short).
        data_tests:
          - not_null
          - accepted_values:
              values: ['Bo3', 'Bo5', 'Bo5_Short']

      - name: set_type
        data_type: string
        description: Indicates whether the set uses standard or short scoring rules
        data_tests:
          - not_null
          - accepted_values:
              values: ['Short', 'Standard']

      - name: best_of
        data_type: integer
        description: Total number of sets to determine the match winner (e.g., 3 or 5)
        data_tests:
          - not_null
          - accepted_values:
              values: [3, 5]

      - name: sets_to_win
        data_type: integer
        description: Number of sets required to win the match (e.g., 2 or 3)
        data_tests:
          - not_null
          - accepted_values:
              values: [2, 3]

      - name: games_per_set
        data_type: integer
        description: Number of games needed to win a set under normal conditions (e.g., 6 or 4 for Fast4)
        data_tests:
          - not_null
          - accepted_values:
              values: [4, 6]

      - name: tiebreak_type
        data_type: string
        description: Type of tiebreak played (e.g., 12-point, SuperTB, MatchTB)
        data_tests:
          - not_null
          - accepted_values:
              values: ['12-point', 'MatchTB', 'SuperTB']
              
      - name: tiebreak_trigger_game
        data_type: string
        description: Game score that triggers a tiebreak (e.g., 6-6, 12-12, 3-3)
        data_tests:
          - not_null
          - accepted_values:
              values: ['3-3', '6-6', '12-12']

      - name: tiebreak_points
        data_type: integer
        description: Number of points required to win the tiebreak (e.g., 7 or 10)
        data_tests:
          - not_null
          - accepted_values:
              values: [7, 10]

      - name: final_set_tiebreak
        description: Indicates whether a tiebreak is used in the final set
        data_tests:
          - not_null
          - accepted_values:
              values: [false, true]

      - name: final_set_tiebreak_trigger_game
        data_type: string
        description: Game score in the final set that triggers a tiebreak (if applicable)
        data_tests:
          - not_null
          - accepted_values:
              values: ['3-3', '6-6', '12-12']
              
      - name: is_ad_scoring
        data_type: boolean
        description: TRUE if advantage scoring is used, FALSE if no-ad scoring is used
        data_tests:
          - not_null
          - accepted_values:
              values: [false, true]

      - name: format_description
        data_type: string
        description: Human-readable description of the tournament format