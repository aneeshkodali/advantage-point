version: 2

models:
  - name: stg__seed__hub_record_sources
    description: Contains sorting order to set record source for (raw data vault) hubs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - hub_name
            - record_source
            - sort_order
    columns:
      - name: hub_name
        description: Hub name.
        data_tests:
          - not_null
      
      - name: record_source
        description: Name of originating source.
        data_tests:
          - not_null

      - name: sort_order
        description: Used to sort record sources within hub.
        data_tests:
          - not_null
