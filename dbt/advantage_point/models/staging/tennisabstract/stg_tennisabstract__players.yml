version: 2

models:
  - name: stg_tennisabstract__players
    description: Staging model for tennisabstract player data.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_name
            - player_gender
    columns:
      - name: player_url
        data_type: string
        description: Link to the match data.
        data_tests:
          - unique
          - not_null

      - name: player_name
        data_type: string
        description: Player name
        data_tests:
          - not_null
      
      - name: player_gender
        data_type: string
        description: Gender of the player.
        data_tests:
          - not_null
          - accepted_values:
              values: ['M', 'W']
              quote: true

      - name: photog_credit
        data_type: string
        description: ""

      - name: current_dubs
        data_type: integer
        description: Current doubles ranking.

      - name: atp_id
        data_type: string
        description: Player ID for tour/organization. Note that this columns refers to both men and women.

      - name: photog_link
        data_type: string
        description: ""
      
      - name: fullname
        data_type: string
        description: Player full name.

      - name: twitter
        data_type: string
        description: Player Twitter handle.

      - name: photog
        data_type: string
        description: ""

      - name: peakfirst
        data_type: date
        description: Date when player first achieved highest singles ranking.

      - name: chartagg
        description: ""

      - name: active
        data_type: boolean
        description: Denotes if player is active.

      - name: nameparam
        data_type: string
        description: ""  

      - name: liverank
        data_type: integer
        description: ""

      - name: shortlist
        description: ""

      - name: careerjs
        description: ""

      - name: peak_dubs
        data_type: integer
        description: Player's peak doubles ranking.

      - name: peakfirst_dubs
        data_type: date
        description: Date when player first achieved highest doubles ranking.

      - name: hand
        data_type: string
        description: Denotes if player is right or left handed.
        data_tests:
          - accepted_values:
              values: ['L', 'R', null]
              quote: true

      - name: currentrank
        data_type: integer
        description: Current singles ranking.

      - name: country
        data_type: string
        description: Player's country (abbreviated).

      - name: backhand
        data_type: string
        description: Denotes if player uses one-handed or two-handed backhand.
        data_tests:
          - accepted_values:
              values: ['1', '2', null]
              quote: true

      - name: peaklast
        data_type: date
        description: Date when player last achieved highest singles ranking.
 
      - name: dc_id
        data_type: string
        description: Player ID for team cup play. Note that this columns refers to both men and women.

      - name: lastname
        data_type: string
        description: Player's last name.

      - name: dob
        data_type: date
        description: Player date of birth.

      - name: ht
        data_type: integer
        description: Player height (in centimeters).
      
      - name: peakrank
        data_type: integer
        description: Player's highest singles ranking.

      - name: itf_id
        data_type: string
        description: Player's ITF (International Tennis Foundation) ID

      - name: wiki_id
        data_type: string
        description: Player's Wikipedia ID.